<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Mizan · Your plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Karla:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* The token lives in the URL hash (never sent to any server), referrer is off, and this page
     loads no analytics, so a person's plan link cannot leak through logs or third parties. */
  :root {
    color-scheme: light only;
    --sage: #4A6B52; --deep: #35503B; --tint: #8FA890; --terracotta: #C77B4D;
    --cream: #F2EEE1; --card: #FFFDF7; --ink: #2A2A20; --text2: #5c5347; --text3: #6b6353;
    --hairline: #ddd6c2;
    --sp-1: 8px; --sp-2: 16px; --sp-3: 24px; --sp-4: 40px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--cream); color: var(--ink); font-family: 'Karla', sans-serif; line-height: 1.6; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 20px; }

  header { text-align: center; padding-top: 40px; }
  .eyebrow { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--sage); font-weight: 700; }
  .wordmark { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 34px; color: var(--deep); margin: var(--sp-1) 0 0; }
  .rule { width: 32px; height: 2px; background: var(--terracotta); margin: var(--sp-2) auto 0; border: none; }

  main { margin-top: var(--sp-4); }
  .muted { text-align: center; color: var(--text3); }

  .state { text-align: center; }
  .state .t { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 24px; color: var(--deep); margin: 0 0 var(--sp-1); }
  .state p { color: var(--text2); margin: 0 auto; max-width: 420px; }

  .progress { text-align: center; }
  .progress .t { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px; color: var(--deep); margin: 0; }
  /* Progress dashboard. "Not yet" is shown as an open outline, never red and never a counted
     failure: the page counts what was done, it does not keep a tally against anyone. */
  .dash { background: var(--card); border: 2px solid var(--hairline); border-radius: 14px; padding: 22px 20px; margin-top: var(--sp-2); }
  .dash-top { display: flex; align-items: center; gap: 20px; }
  .ring { position: relative; width: 112px; height: 112px; flex: 0 0 auto; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .track { fill: none; stroke: var(--hairline); stroke-width: 10; }
  .ring .fill { fill: none; stroke: var(--sage); stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .ring .num { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 30px; color: var(--deep); line-height: 1; }
  .ring .of { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-top: 4px; }
  .stats { display: grid; gap: 10px; flex: 1; }
  .stat .v { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 24px; color: var(--ink); line-height: 1.1; }
  .stat .k { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; }
  .week-label { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--tint); font-weight: 700; margin: 18px 0 6px; }
  .grid7 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .cell { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; border: 2px solid var(--hairline); color: var(--text3); background: var(--cream); }
  .cell.done { background: var(--sage); border-color: var(--sage); color: var(--card); }
  .cell.partly { background: var(--tint); border-color: var(--tint); color: var(--card); }
  .cell.notyet { background: var(--card); border: 2px dashed var(--tint); color: var(--text3); }
  .cell.open { background: var(--card); border-color: var(--sage); color: var(--deep); }
  .cell.future { opacity: 0.45; }
  .cell.today { box-shadow: 0 0 0 2px var(--card), 0 0 0 4px var(--terracotta); }
  .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 14px; margin-top: 16px; font-size: 12px; color: var(--text3); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; border: 2px solid var(--hairline); }
  .legend i.done { background: var(--sage); border-color: var(--sage); }
  .legend i.partly { background: var(--tint); border-color: var(--tint); }
  .legend i.notyet { background: var(--card); border: 2px dashed var(--tint); }
  .legend i.today { background: var(--card); border-color: var(--terracotta); }

  .card { background: var(--card); border: 2px solid var(--hairline); border-radius: 14px; padding: 22px 20px; margin-top: var(--sp-3); }
  .label { font-size: 11.5px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--sage); font-weight: 700; margin-bottom: var(--sp-1); }
  .card h2 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 24px; line-height: 1.3; color: var(--ink); margin: 0 0 var(--sp-2); }
  .step { font-size: 16px; white-space: pre-line; margin: 0; }
  .why { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; font-size: 18px; line-height: 1.5; margin: var(--sp-3) 0 0; white-space: pre-line; }
  .source { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--terracotta); font-weight: 700; margin-top: var(--sp-1); }

  .checkin .q { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 21px; color: var(--deep); margin: 0 0 var(--sp-2); text-align: center; }
  .choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .choice { font-family: 'Karla'; font-size: 15px; font-weight: 600; color: var(--ink); background: var(--cream); border: 2px solid var(--hairline); border-radius: 10px; padding: 12px 6px; cursor: pointer; min-height: 48px; }
  .choice.picked { border-color: var(--sage); background: #eef2ea; }
  textarea { width: 100%; margin-top: var(--sp-2); font-family: 'Karla'; font-size: 15px; color: var(--ink); background: var(--cream); border: 2px solid var(--hairline); border-radius: 10px; padding: 11px 13px; min-height: 80px; resize: vertical; }
  textarea:focus, .choice:focus { outline: none; border-color: var(--sage); }
  .btn { display: block; width: 100%; margin-top: var(--sp-2); background: var(--sage); color: var(--card); font-family: 'Karla'; font-weight: 700; font-size: 15px; padding: 14px; border: none; border-radius: 999px; cursor: pointer; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .sent { text-align: center; color: var(--text2); margin: 0; }
  .err { color: var(--terracotta); font-size: 14px; text-align: center; margin: var(--sp-1) 0 0; min-height: 20px; }

  .rule-note { text-align: center; font-size: 13px; color: var(--text3); margin: -8px 0 var(--sp-2); }
  .q2 { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 19px; color: var(--deep); margin: var(--sp-3) 0 var(--sp-1); text-align: center; }
  .times { display: flex; align-items: center; justify-content: center; gap: 10px; }
  .times button { width: 48px; height: 48px; border-radius: 50%; border: 2px solid var(--hairline); background: var(--cream); font-size: 22px; font-weight: 700; color: var(--deep); cursor: pointer; line-height: 1; }
  .times input { width: 84px; height: 48px; text-align: center; font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 26px; color: var(--ink); background: var(--cream); border: 2px solid var(--hairline); border-radius: 10px; margin: 0; padding: 0; -moz-appearance: textfield; }
  .times input::-webkit-inner-spin-button, .times input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .times input:focus { outline: none; border-color: var(--sage); }

  /* Times-per-day chart: one series, one hue, no legend (the title names it), thin bars with a
     rounded data end on a shared baseline, value labels only on the first and latest bars,
     tap or hover a bar for its value. */
  .chart { margin-top: 18px; }
  .chart-title { font-size: 10.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-bottom: 6px; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .cap { font-size: 13px; color: var(--text2); text-align: center; margin: 4px 0 0; min-height: 18px; }
  .chart .empty { font-size: 13px; color: var(--text3); text-align: center; padding: 12px 0; margin: 0; background: var(--cream); border-radius: 10px; }

  /* Author display rules (.fab, .sheet, .toast) beat the browser default for [hidden]. */
  [hidden] { display: none !important; }
  body { padding-bottom: 72px; }

  /* Logging through the day. "It happened" is neutral, never red: the log records, it does not judge. */
  .logcard .log-hint { font-size: 14px; color: var(--text2); margin: 0 0 var(--sp-2); }
  .log-sum { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 20px; color: var(--deep); margin: 0 0 var(--sp-1); }
  .log-list { list-style: none; padding: 0; margin: 0 0 var(--sp-2); }
  .log-list li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--hairline); font-size: 14.5px; }
  .log-list .lt { color: var(--text3); min-width: 66px; font-variant-numeric: tabular-nums; }
  .log-list .lw { flex: 1; color: var(--ink); }
  .log-list .lo { font-weight: 700; font-size: 13px; }
  .log-list .lo.held { color: var(--sage); }
  .log-list .lo.happened { color: var(--text3); }
  .log-list .lx { background: none; border: none; color: var(--text3); font-size: 18px; cursor: pointer; padding: 4px 6px; line-height: 1; }
  .fab { position: fixed; right: 16px; bottom: 18px; z-index: 20; background: var(--sage); color: var(--card); border: none; border-radius: 999px; padding: 14px 20px; font-family: 'Karla'; font-weight: 700; font-size: 15px; box-shadow: 0 6px 18px rgba(42, 42, 32, 0.22); cursor: pointer; }
  .sheet { position: fixed; inset: 0; z-index: 30; background: rgba(42, 42, 32, 0.35); display: flex; align-items: flex-end; justify-content: center; }
  .sheet-panel { background: var(--card); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 22px 20px 26px; }
  .sheet-title { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 24px; color: var(--deep); text-align: center; margin: 0 0 var(--sp-1); }
  .sheet-sub { font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin: var(--sp-2) 0 var(--sp-1); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { font-family: 'Karla'; font-size: 14.5px; font-weight: 600; color: var(--ink); background: var(--cream); border: 2px solid var(--hairline); border-radius: 999px; padding: 9px 14px; cursor: pointer; }
  .chip.picked { border-color: var(--sage); background: #eef2ea; }
  .outs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .out { font-family: 'Karla'; font-weight: 700; font-size: 16px; border-radius: 12px; padding: 16px 10px; cursor: pointer; min-height: 56px; }
  /* Both answers start neutral so neither looks pre-chosen; Save unlocks only once one is picked. */
  .out { background: var(--cream); color: var(--ink); border: 2px solid var(--hairline); }
  .out.picked { border-color: var(--sage); background: #eef2ea; color: var(--deep); }
  .sheet-save { margin-top: var(--sp-3); }
  .sheet-cancel { display: block; margin: var(--sp-2) auto 0; background: none; border: none; font-family: 'Karla'; font-weight: 700; color: var(--text3); font-size: 14px; cursor: pointer; padding: 8px; }
  .toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: 999px; font-size: 14px; white-space: nowrap; }
  .prefill-note { text-align: center; font-size: 13px; color: var(--text3); margin: 8px 0 0; }

  details { background: var(--card); border: 2px solid var(--hairline); border-radius: 12px; padding: 12px 16px; margin-top: var(--sp-1); }
  details summary { cursor: pointer; font-weight: 700; color: var(--text2); }
  details .step { margin-top: var(--sp-1); }
  .earlier { margin-top: var(--sp-4); }
  .earlier > .label { text-align: center; }

  footer { text-align: center; margin-top: var(--sp-4); padding-bottom: 40px; }
  footer .w { font-family: 'Cormorant Garamond', serif; font-weight: 700; font-size: 18px; color: var(--sage); }
  footer .h { font-size: 10px; letter-spacing: 2.2px; text-transform: uppercase; color: var(--text3); font-weight: 700; margin-top: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Bismillah</div>
    <div class="wordmark">Your plan</div>
    <hr class="rule">
  </header>
  <main id="app"><p class="muted">Loading your plan...</p></main>
  <footer><div class="w">Mizan</div><div class="h">@mizan.guide</div></footer>
</div>

<button type="button" class="fab" id="fab" hidden>+ Log a moment</button>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <p class="sheet-title" id="sheet-title">An urge just came</p>
    <p class="sheet-sub">What set it off? Optional</p>
    <div class="chips">
      <button type="button" class="chip" data-t="bored">Bored</button>
      <button type="button" class="chip" data-t="stressed">Stressed</button>
      <button type="button" class="chip" data-t="lonely">Lonely</button>
      <button type="button" class="chip" data-t="tired">Tired</button>
      <button type="button" class="chip" data-t="saw">Something I saw</button>
      <button type="button" class="chip" data-t="other">Other</button>
    </div>
    <p class="sheet-sub">What happened?</p>
    <div class="outs">
      <button type="button" class="out held" data-o="held">I held on</button>
      <button type="button" class="out happened" data-o="happened">It happened</button>
    </div>
    <button type="button" class="btn sheet-save" id="sheet-save" disabled>Save</button>
    <button type="button" class="sheet-cancel" id="sheet-cancel">Cancel</button>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script>
  const SUPABASE_URL = 'https://wxwuxajfnefabiipgptx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind4d3V4YWpmbmVmYWJpaXBncHR4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NjE3MjAsImV4cCI6MjEwNDMzNzcyMH0.3OiKcmOfX4KCp-OjaHdBIo7HJeMUjX_XozxlhUF-3fA';
  const EMAILJS_PUBLIC_KEY = 'QM5B6uhuH-kM3u-T2';
  const EMAILJS_SERVICE_ID = 'service_xohz5c2';
  const EMAILJS_TEMPLATE_ID = 'template_9kl5nrd';
  try { emailjs.init(EMAILJS_PUBLIC_KEY); } catch (e) {}

  const CHOICES = [['done', 'Done'], ['partly', 'Partly'], ['not_yet', 'Not yet']];
  const app = document.getElementById('app');
  const token = decodeURIComponent(location.hash.slice(1)).trim();
  const TOKEN_OK = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(token);

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  async function rpc(fn, body) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error('Request failed: ' + res.status);
    return res.json();
  }

  const TRIGGERS = { bored: 'Bored', stressed: 'Stressed', lonely: 'Lonely', tired: 'Tired', saw: 'Something I saw', other: 'Other' };
  const fab = document.getElementById('fab');
  const sheet = document.getElementById('sheet');
  const toastEl = document.getElementById('toast');
  let currentPlan = null;
  let pickedTrigger = null;
  let fabObserver = null;

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => { toastEl.hidden = true; }, 2600);
  }

  function openSheet() {
    pickedTrigger = null;
    sheet.querySelectorAll('.chip').forEach((c) => c.classList.remove('picked'));
    pickedOutcome = null;
    sheet.querySelectorAll('.out').forEach((b) => { b.classList.remove('picked'); b.setAttribute('aria-pressed', 'false'); });
    saveBtn.disabled = true;
    saveBtn.textContent = 'Save';
    sheet.hidden = false;
  }
  function closeSheet() { sheet.hidden = true; }

  sheet.querySelectorAll('.chip').forEach((c) => c.addEventListener('click', () => {
    const on = !c.classList.contains('picked');
    sheet.querySelectorAll('.chip').forEach((x) => x.classList.remove('picked'));
    pickedTrigger = on ? c.dataset.t : null;
    if (on) c.classList.add('picked');
  }));
  const saveBtn = document.getElementById('sheet-save');
  let pickedOutcome = null;
  sheet.querySelectorAll('.out').forEach((b) => b.addEventListener('click', () => {
    pickedOutcome = b.dataset.o;
    sheet.querySelectorAll('.out').forEach((x) => {
      x.classList.toggle('picked', x === b);
      x.setAttribute('aria-pressed', String(x === b));
    });
    saveBtn.disabled = false;
  }));
  saveBtn.addEventListener('click', async () => {
    if (!pickedOutcome) return;
    const outcome = pickedOutcome;
    saveBtn.disabled = true;
    saveBtn.textContent = 'Saving...';
    try {
      const res = await rpc('log_moment', { p_token: token, p_trigger: pickedTrigger, p_outcome: outcome });
      if (!res || !res.id) throw new Error('rejected');
      currentPlan.logs = [...(currentPlan.logs || []), { id: res.id, day: res.day, trigger: pickedTrigger, outcome, at: res.at }];
      closeSheet();
      render(currentPlan);
      toast(outcome === 'held' ? 'Saved. You held on.' : 'Saved. Keep going with your day.');
    } catch (e) {
      saveBtn.disabled = false;
      saveBtn.textContent = 'Save';
      toast('That did not save. Please try again.');
    }
  });
  document.getElementById('sheet-cancel').addEventListener('click', closeSheet);
  sheet.addEventListener('click', (e) => { if (e.target === sheet) closeSheet(); });
  fab.addEventListener('click', openSheet);

  async function removeLog(id) {
    try {
      const ok = await rpc('remove_log', { p_token: token, p_id: id });
      if (ok !== true) throw new Error('rejected');
      currentPlan.logs = (currentPlan.logs || []).filter((l) => l.id !== id);
      render(currentPlan);
      toast('Removed.');
    } catch (e) {
      toast('That did not go through. Please try again.');
    }
  }

  function showState(title, text) {
    const s = el('section', 'state');
    s.append(el('p', 't', title), el('p', null, text));
    app.replaceChildren(s);
  }

  function buildChart(timesByDay, todayDay, total) {
    const wrap = el('div', 'chart');
    wrap.append(el('div', 'chart-title', 'Times per day'));
    const recorded = [...timesByDay.keys()].sort((a, b) => a - b);
    if (!recorded.length) {
      wrap.append(el('p', 'empty', 'Your count shows up here after your first check-in.'));
      return wrap;
    }
    const plural = (v) => `${v} ${v === 1 ? 'time' : 'times'}`;
    const W = 300, H = 120, top = 18, base = 98;
    const max = Math.max(1, ...timesByDay.values());
    const step = W / total;
    const bw = Math.max(4, step - 4);
    const ns = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs, text) => {
      const n = document.createElementNS(ns, tag);
      Object.entries(attrs).forEach(([k, v]) => n.setAttribute(k, v));
      if (text != null) n.textContent = text;
      return n;
    };
    const svg = mk('svg', {
      viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': 'Times per day. ' + recorded.map((d) => `Day ${d}: ${plural(timesByDay.get(d))}`).join('. '),
    });
    svg.append(mk('line', { x1: 0, x2: W, y1: top, y2: top, stroke: '#ddd6c2', 'stroke-width': 1, 'stroke-dasharray': '2 3' }));
    svg.append(mk('text', { x: W, y: top - 5, 'text-anchor': 'end', 'font-size': 9, fill: '#6b6353' }, String(max)));
    svg.append(mk('line', { x1: 0, x2: W, y1: base, y2: base, stroke: '#ddd6c2', 'stroke-width': 1 }));

    const first = recorded[0];
    const last = recorded[recorded.length - 1];
    const defaultCap = first === last
      ? `Day ${first}: ${plural(timesByDay.get(first))}`
      : `Day ${first}: ${plural(timesByDay.get(first))}. Day ${last}: ${plural(timesByDay.get(last))}.`;
    const cap = el('p', 'cap', defaultCap);

    for (let d = 1; d <= total; d++) {
      const cx = step * (d - 0.5);
      const g = mk('g', {});
      if (timesByDay.has(d)) {
        const v = timesByDay.get(d);
        const h = v === 0 ? 2 : Math.max(4, (v / max) * (base - top));
        const x = cx - bw / 2;
        const y = base - h;
        const r = Math.min(4, bw / 2, h);
        g.append(mk('path', {
          d: `M${x},${base} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${base} Z`,
          fill: '#4A6B52',
        }));
        if (d === first || d === last || v === 0) {
          g.append(mk('text', { x: cx, y: y - 4, 'text-anchor': 'middle', 'font-size': 10, 'font-weight': 700, fill: '#2A2A20' }, String(v)));
        }
        g.append(mk('title', {}, `Day ${d}: ${plural(v)}`));
        g.append(mk('rect', { x: cx - step / 2, y: 0, width: step, height: base, fill: 'transparent' }));
        g.style.cursor = 'pointer';
        const show = () => { cap.textContent = `Day ${d}: ${plural(v)}`; };
        g.addEventListener('mouseenter', show);
        g.addEventListener('click', show);
        g.addEventListener('mouseleave', () => { cap.textContent = defaultCap; });
      }
      g.append(mk('text', {
        x: cx, y: base + 14, 'text-anchor': 'middle', 'font-size': 9,
        fill: d === todayDay ? '#C77B4D' : '#6b6353', 'font-weight': d === todayDay ? 700 : 400,
      }, String(d)));
      svg.append(g);
    }
    wrap.append(svg, cap);
    return wrap;
  }

  function buildDashboard(checkins, publishedCount, todayDay, total, timesByDay, heldTotal = 0) {
    const vals = [...checkins.values()];
    const doneN = vals.filter((v) => v === 'done').length;
    const partlyN = vals.filter((v) => v === 'partly').length;
    const pct = Math.min(1, (doneN + partlyN * 0.5) / total);

    // Today not checked in yet does not break the streak, it just hasn't happened yet.
    let streak = 0;
    let d = checkins.has(todayDay) ? todayDay : todayDay - 1;
    while (d >= 1 && ['done', 'partly'].includes(checkins.get(d))) { streak++; d--; }

    const dash = el('section', 'dash');
    const top = el('div', 'dash-top');

    const r = 46, C = 2 * Math.PI * r;
    const ring = el('div', 'ring');
    ring.innerHTML = `<svg viewBox="0 0 112 112" aria-hidden="true"><circle class="track" cx="56" cy="56" r="${r}"/><circle class="fill" cx="56" cy="56" r="${r}" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}"/></svg>`;
    const center = el('div', 'center');
    center.append(el('div', 'num', `${Math.round(pct * 100)}%`), el('div', 'of', 'complete'));
    ring.append(center);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      ring.querySelector('.fill').setAttribute('stroke-dashoffset', (C * (1 - pct)).toFixed(2));
    }));

    const stats = el('div', 'stats');
    [
      [`${doneN}`, doneN === 1 ? 'Day done' : 'Days done'],
      [`${streak} ${streak === 1 ? 'day' : 'days'}`, 'Current streak'],
      [`${heldTotal}`, 'Urges held back'],
    ].forEach(([v, k]) => {
      const s = el('div', 'stat');
      s.append(el('div', 'v', v), el('div', 'k', k));
      stats.append(s);
    });
    top.append(ring, stats);
    dash.append(top);
    dash.append(buildChart(timesByDay || new Map(), todayDay, total));

    for (let w = 0; w < Math.ceil(total / 7); w++) {
      dash.append(el('div', 'week-label', `Week ${w + 1}`));
      const grid = el('div', 'grid7');
      for (let i = w * 7 + 1; i <= Math.min(total, w * 7 + 7); i++) {
        const state = checkins.get(i);
        const c = el('div', 'cell', String(i));
        if (state === 'done') c.classList.add('done');
        else if (state === 'partly') c.classList.add('partly');
        else if (state === 'not_yet') c.classList.add('notyet');
        else if (i <= publishedCount) c.classList.add('open');
        else c.classList.add('future');
        if (i === todayDay) c.classList.add('today');
        c.title = `Day ${i}`;
        grid.append(c);
      }
      dash.append(grid);
    }

    const legend = el('div', 'legend');
    [['done', 'Done'], ['partly', 'Partly'], ['notyet', 'Not yet'], ['today', 'Today']].forEach(([cls, label]) => {
      const s = el('span');
      s.append(el('i', cls), document.createTextNode(label));
      legend.append(s);
    });
    dash.append(legend);
    return dash;
  }

  function render(plan) {
    if (!plan) {
      showState('Your plan starts once payment is confirmed.',
        "We'll message you the moment Day 1 is ready. Keep this link, it's yours and only yours.");
      return;
    }
    currentPlan = plan;
    const days = plan.days || [];
    if (!days.length) {
      showState('Day 1 is being written from your answers.',
        'It will appear right here soon. Keep this link, it is yours and only yours.');
      return;
    }
    const checkins = new Map((plan.checkins || []).map((c) => [c.day, c.did_it]));
    const today = days[days.length - 1];
    const total = plan.total_days || 14;
    app.replaceChildren();

    const prog = el('section', 'progress');
    prog.append(el('p', 't', `Day ${today.day} of ${total}`));
    app.append(prog);
    const timesByDay = new Map((plan.checkins || []).filter((c) => c.times != null).map((c) => [c.day, c.times]));
    const heldTotal = (plan.logs || []).filter((l) => l.outcome === 'held').length;
    app.append(buildDashboard(checkins, days.length, today.day, total, timesByDay, heldTotal));

    const card = el('section', 'card');
    card.append(el('div', 'label', "Today's step"), el('h2', null, today.title), el('p', 'step', today.step));
    if (today.why) card.append(el('p', 'why', today.why));
    if (today.source) card.append(el('div', 'source', today.source));
    app.append(card);

    // Logging through the day: moments save as they happen, so nothing has to be remembered at
    // bedtime, and the end-of-day count is filled in from them. After the day is closed, new
    // moments count toward tomorrow (the database assigns the day, this only mirrors it).
    const closedToday = checkins.has(today.day);
    const canLog = !(closedToday && today.day >= total);
    const openDay = closedToday ? today.day + 1 : today.day;
    if (canLog) {
      const dayLogs = (plan.logs || []).filter((l) => l.day === openDay);
      const logCard = el('section', 'card logcard');
      logCard.append(el('div', 'label', closedToday ? "Tomorrow's log" : "Today's log"));
      if (closedToday) logCard.append(el('p', 'log-hint', 'Your day is closed. Anything you log now counts toward tomorrow.'));
      if (!dayLogs.length) {
        logCard.append(el('p', 'log-hint', 'When an urge comes, tap Log a moment. It saves right away, so you do not have to remember it tonight.'));
      } else {
        const held = dayLogs.filter((l) => l.outcome === 'held').length;
        logCard.append(el('p', 'log-sum', `Held on ${held}. It happened ${dayLogs.length - held}.`));
        const list = el('ul', 'log-list');
        dayLogs.slice().reverse().forEach((l) => {
          const li = el('li');
          const time = new Date(l.at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          li.append(
            el('span', 'lt', time),
            el('span', 'lw', TRIGGERS[l.trigger] || 'No tag'),
            el('span', `lo ${l.outcome}`, l.outcome === 'held' ? 'Held on' : 'It happened'),
          );
          const x = el('button', 'lx', '×');
          x.type = 'button';
          x.setAttribute('aria-label', 'Remove this entry');
          x.addEventListener('click', () => removeLog(l.id));
          li.append(x);
          list.append(li);
        });
        logCard.append(list);
      }
      const lb = el('button', 'btn', 'Log a moment');
      lb.type = 'button';
      lb.addEventListener('click', openSheet);
      logCard.append(lb);
      app.append(logCard);
    }
    fab.hidden = !canLog;

    const ci = el('section', 'card checkin');
    if (checkins.has(today.day)) {
      ci.append(el('p', 'sent', today.day >= total
        ? 'Got it. That was your last day. We will be in touch about what comes next.'
        : "Got it. Tomorrow's step is built from what you told us, and it will be here by 9am Pakistan time."));
    } else {
      let choice = null;
      ci.append(el('div', 'label', 'End my day'), el('p', 'q', "Did you do today's step?"), el('p', 'rule-note', 'Do this right before you sleep. It closes your day.'));
      const row = el('div', 'choices');
      const send = el('button', 'btn', 'End my day');
      send.disabled = true;
      const timesInput = el('input');
      timesInput.type = 'number';
      timesInput.min = '0';
      timesInput.max = '99';
      timesInput.inputMode = 'numeric';
      timesInput.placeholder = '';
      timesInput.setAttribute('aria-label', 'How many times today');
      const updateSend = () => { send.disabled = !(choice && timesInput.value !== ''); };
      timesInput.addEventListener('input', updateSend);
      const bump = (d) => {
        const cur = timesInput.value === '' ? null : Number(timesInput.value);
        const next = cur === null ? (d > 0 ? 1 : 0) : Math.max(0, Math.min(99, cur + d));
        timesInput.value = String(next);
        updateSend();
      };
      const minus = el('button', null, '−');
      const plus = el('button', null, '+');
      minus.type = 'button';
      plus.type = 'button';
      minus.setAttribute('aria-label', 'One less');
      plus.setAttribute('aria-label', 'One more');
      minus.addEventListener('click', () => bump(-1));
      plus.addEventListener('click', () => bump(1));
      const timesRow = el('div', 'times');
      timesRow.append(minus, timesInput, plus);
      const todaysLogs = (plan.logs || []).filter((l) => l.day === today.day);
      if (todaysLogs.length) timesInput.value = String(todaysLogs.filter((l) => l.outcome === 'happened').length);
      const prefillNote = todaysLogs.length ? el('p', 'prefill-note', 'Filled in from your log. Change it if it is off.') : null;
      CHOICES.forEach(([val, label]) => {
        const b = el('button', 'choice', label);
        b.type = 'button';
        b.addEventListener('click', () => {
          choice = val;
          row.querySelectorAll('.choice').forEach((x) => x.classList.remove('picked'));
          b.classList.add('picked');
          updateSend();
        });
        row.append(b);
      });
      const note = el('textarea');
      note.placeholder = 'Anything that would help us shape tomorrow\'s step? (optional)';
      note.maxLength = 2000;
      const err = el('p', 'err');
      send.addEventListener('click', async () => {
        if (!choice || timesInput.value === '') return;
        const times = Math.max(0, Math.min(99, Math.round(Number(timesInput.value))));
        send.disabled = true;
        send.textContent = 'Closing your day...';
        err.textContent = '';
        try {
          const ok = await rpc('submit_checkin', { p_token: token, p_day: today.day, p_did_it: choice, p_note: note.value || null, p_times: times });
          if (ok !== true) throw new Error('rejected');
          try {
            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
              instagram: `Check-in, plan ${plan.ref}, day ${today.day}`,
              email: 'not given',
              struggle: note.value.trim() || 'no note',
              timing: CHOICES.find((c) => c[0] === choice)[1],
              duration: `${times} ${times === 1 ? 'time' : 'times'} ${today.day === 1 ? 'in the last 24 hours' : 'today'}`, tried: 'n/a', more: `logged today: held ${todaysLogs.filter((l) => l.outcome === 'held').length}, happened ${todaysLogs.filter((l) => l.outcome === 'happened').length}`,
            }).catch(() => {});
          } catch (e) {}
          plan.checkins = [...(plan.checkins || []).filter((c) => c.day !== today.day), { day: today.day, did_it: choice, times }];
          render(plan);
        } catch (e) {
          send.disabled = false;
          send.textContent = 'End my day';
          err.textContent = 'That did not go through. Please try again, or message us directly.';
        }
      });
      // Day protocol: a day runs from waking up to sleeping, and this check-in closes it. Day 1
      // asks about the last 24 hours so a plan started in the evening still gets a full baseline.
      const countQ = today.day === 1 ? 'How many times in the last 24 hours?' : 'How many times today, since you woke up?';
      ci.append(row, el('p', 'q2', countQ), timesRow, ...(prefillNote ? [prefillNote] : []), note, send, err);
    }
    app.append(ci);

    // The floating button would sit on top of the log's remove buttons and the End my day card,
    // so it hides while either of those cards is on screen (both have their own buttons) and
    // shows only higher up the page, where logging is otherwise out of reach.
    if (fabObserver) fabObserver.disconnect();
    if (canLog && 'IntersectionObserver' in window) {
      const visible = new Set();
      fabObserver = new IntersectionObserver((entries) => {
        entries.forEach((e) => { if (e.isIntersecting) visible.add(e.target); else visible.delete(e.target); });
        fab.hidden = visible.size > 0;
      });
      [app.querySelector('.logcard'), ci].filter(Boolean).forEach((c) => fabObserver.observe(c));
    }

    if (days.length > 1) {
      const earlier = el('section', 'earlier');
      earlier.append(el('div', 'label', 'Earlier days'));
      days.slice(0, -1).reverse().forEach((d) => {
        const det = el('details');
        det.append(el('summary', null, `Day ${d.day}: ${d.title}`), el('p', 'step', d.step));
        earlier.append(det);
      });
      app.append(earlier);
    }
  }

  // A change after the # is a same-page navigation with no reload, which would leave `token`
  // stale. Reloading keeps the page and the link it was opened with always in step.
  window.addEventListener('hashchange', () => location.reload());

  if (!TOKEN_OK) {
    showState("This link doesn't look right.", 'Message us on Instagram at @mizan.guide and we will send your plan link again.');
  } else {
    rpc('get_plan', { p_token: token })
      .then(render)
      .catch(() => showState('We could not load your plan just now.', 'Please refresh in a minute. If it keeps happening, message us at @mizan.guide.'));
  }
</script>
